<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ログイン | Growbit Garden</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <!-- 左：ビジュアル -->
    <div class="auth-visual">
      <div class="visual-circle">
        <!-- ここに画像入れる -->
        <img src="images/hero-boy.png" alt="イラスト">
      </div>
      <h2>おかえりなさい</h2>
      <p>今日の学びも、コツコツ育てていこう。</p>
    </div>

    <!-- 右：フォーム -->
    <div class="auth-form">
      <h1>ログイン</h1>

      <form>
        <label>メールアドレス</label>
        <input type="email" placeholder="example@mail.com">

        <label>パスワード</label>
        <input type="password" placeholder="••••••••">

        <div class="form-options">
          <label><input type="checkbox"> ログイン状態を保持</label>
          <a href="#" class="link-forgot">パスワードを忘れた？</a>
        </div>

        <button class="btn btn-primary wide">ログイン</button>
      </form>

      <p class="auth-link">
        アカウントをお持ちでない方
      </p>

      <a href="signup.html" class="register-btn">新規登録する</a>
    </div>

  </div>

</body>

</html>
